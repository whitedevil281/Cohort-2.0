<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paino</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1 id="title"></h1>
      <div class="painobox">
        <div class="box1 box">
          <div class="blackbox">
            <button class="black" id="key-1">1</button>
            <button class="black" id="key-2">2</button>
          </div>
          <div class="whitebox">
            <button class="white" id="q">Q</button>
            <button class="white" id="w">W</button>
            <button class="white" id="e">E</button>
          </div>
        </div>
        <div class="box2 box">
          <div class="blackbox">
            <button class="black" id="key-3">3</button>
            <button class="black" id="key-4">4</button>
            <button class="black" id="key-5">5</button>
          </div>
          <div class="whitebox">
            <button class="white" id="r">R</button>
            <button class="white" id="t">T</button>
            <button class="white" id="y">Y</button>
            <button class="white" id="u">U</button>
          </div>
        </div>
        <div class="box3 box">
          <div class="blackbox">
            <button class="black" id="key-6">6</button>
            <button class="black" id="key-7">7</button>
          </div>
          <div class="whitebox">
            <button class="white" id="i">I</button>
            <button class="white" id="o">O</button>
            <button class="white" id="p">P</button>
          </div>
        </div>
        <div class="box4 box">
          <div class="blackbox">
            <button class="black" id="key-8">8</button>
            <button class="black" id="key-9">9</button>
            <button class="black" id="key-0">0</button>
          </div>
          <div class="whitebox">
            <button class="white" id="a">A</button>
            <button class="white" id="s">S</button>
            <button class="white" id="d">D</button>
            <button class="white" id="f">F</button>
          </div>
        </div>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
