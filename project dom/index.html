<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="scss/main.css" />
  <title>Productivity</title>
</head>

<body>
  <div class="blur-overlay"></div>
  <main>
    <div class="chnagetheme">
      <button id="changetheme">Change Theme</button>
    </div>
    <section class="section-view1">
      <nav>
        <div class="nav">
          <h1>Productivity Dashboard</h1>
        </div>
      </nav>
      <div class="view1 box-hover-animation z-index-3">
        <div class="view1-left">
          <div class="date">4 May 2025</div>
          <div class="time">
            <div class="day">Sunday,</div>
            <div class="time-data">12:29:35 AM</div>
          </div>
          <div class="line"></div>
          <div class="city">Bhopal</div>
        </div>
        <div class="view1-right">
          <div class="view1-right-top">
            <div class="temp">20°C</div>
            <div class="weather">Sunny</div>
          </div>
          <div class="view1-right-bottom">
            <div class="humidity weatherinfo">Humidity: 50%</div>
            <div class="wind weatherinfo">Wind: 10 km/h</div>
          </div>
        </div>
      </div>
    </section>
    <section class="section-view2">
      <div class="box-main box-hover-animation z-index-3" id="todo-mainbox">
        <div class="box-down" id="todo"></div>
        <div class="heading-box">
          <div class="heading">To-Do List</div>
          <div class="line"></div>
        </div>
      </div>
      <div class="box-main box-hover-animation z-index-3" id="dailyplanner-mainbox">
        <div class="box-down" id="dailyplanner"></div>
        <div class="heading-box">
          <div class="heading">Daily Planner</div>
          <div class="line"></div>
        </div>
      </div>
      <div class="box-main box-hover-animation z-index-3" id="motivation-mainbox">
        <div class="box-down" id="motivation"></div>
        <div class="heading-box">
          <div class="heading">Motivation</div>
          <div class="line"></div>
        </div>
      </div>
      <div class="box-main box-hover-animation z-index-3" id="pomodoro-mainbox">
        <div class="box-down" id="pomodoro"></div>
        <div class="heading-box">
          <div class="heading" id="pomodoro-heading">Pomodoro</div>
          <div class="line"></div>
        </div>
      </div>
      <div class="box-main box-hover-animation z-index-3" id="kanbanboard-mainbox">
        <div class="box-down" id="kanbanboard"></div>
        <div class="heading-box">
          <div class="heading">Kanban Board</div>
          <div class="line"></div>
        </div>
      </div>
    </section>
    <div class="box-anchor z-index-3 anchor-todo-bg" id="anchor-box-todo" data-original-id="anchor-box-todo">
      <div class="todo-main">
        <h2 class="todo-title">To-Do</h2>
        <div class="todo-input-container">
          <input type="text" id="todo-input" placeholder="What do you need to do?" />
          <label class="todo-imp-label">
            <input type="checkbox" id="todo-imp-checkbox" />
            <span>Mark as Important</span>
          </label>
          <button id="todo-add-btn">+</button>
        </div>

        <ul class="todo-list">
         
        </ul>
      </div>

      <button class="exitbutton" id="todo-exitbutton">X</button>
    </div>
    </div>
    <div class="box-anchor z-index-3 anchor-dailyplanner-bg" id="anchor-box-dailyplanner"
      data-original-id="anchor-box-dailyplanner">


      
      <button class="exitbutton" id="dailyplanner-exitbutton">X</button>
    </div>
    <div class="box-anchor z-index-3 anchor-motivation-bg" id="anchor-box-motivation"
      data-original-id="anchor-box-motivation">
      <button class="exitbutton" id="motivation-exitbutton">X</button>
    </div>
    <div class="box-anchor z-index-3 anchor-pomodoro-bg" id="anchor-box-pomodoro"
      data-original-id="anchor-box-pomodoro">
      <button class="exitbutton" id="pomodoro-exitbutton">X</button>
    </div>
    <div class="box-anchor z-index-3 anchor-kanbanboard-bg" id="anchor-box-kanbanboard"
      data-original-id="anchor-box-kanbanboard">
      <button class="exitbutton" id="kanbanboard-exitbutton">X</button>
    </div>
  </main>

  <script type="module" src="script.js"></script>
</body>

</html>
